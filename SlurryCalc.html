<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeniCalc v1.0 - 矿浆自流计算器 [Issued by Zichao]</title>
    <style>
        /* 全局现代扁平化样式 */
        :root {
            --primary-color: #2C3E50;
            --accent-color: #2980B9;
            --success-color: #27AE60;
            --warning-color: #E67E22;
            --danger-color: #E74C3C;
            --bg-color: #F8F9FA;
            --panel-bg: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 1. 启动欢迎画面 (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--primary-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
            border-top: 8px solid #3498DB;
        }
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .splash-title { color: #FFFFFF; font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .splash-sub { color: #BDC3C7; font-size: 16px; margin-bottom: 30px; }
        .splash-issue { color: var(--warning-color); font-size: 18px; font-weight: 600; margin-bottom: 40px; }
        .splash-footer { color: #7F8C8D; font-size: 12px; }

        /* 2. 主程序窗体 */
        .app-container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            border: 1px solid #CED4DA;
        }

        /* 左侧输入面板 */
        .input-panel {
            flex: 4;
            min-width: 350px;
            padding: 20px;
            border-right: 1px solid #E5E7E9;
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 15px; font-weight: bold; padding-bottom: 10px;
            margin-bottom: 15px; border-bottom: 1px solid #E5E7E9; color: #555;
        }
        .form-group {
            display: flex; align-items: center; margin-bottom: 12px;
        }
        .form-group label { flex: 6; font-size: 13px; color: #333; }
        .form-group input {
            flex: 3; padding: 6px 10px; font-size: 13px; text-align: right;
            border: 1px solid #CED4DA; border-radius: 4px; font-family: Consolas, monospace;
        }
        .form-group input:focus { border-color: var(--accent-color); outline: none; }
        .form-group .unit { flex: 2; padding-left: 10px; font-size: 13px; color: #7F8C8D; }

        /* 按钮样式 */
        .btn-calc {
            width: 100%; background: var(--primary-color); color: white;
            border: none; padding: 12px; font-size: 15px; font-weight: bold;
            border-radius: 4px; cursor: pointer; margin-top: 15px; transition: background 0.2s;
        }
        .btn-calc:hover { background: #34495E; }
        
        .btn-top {
            width: 100%; background: #FFF; color: #333;
            border: 1px solid #CED4DA; padding: 8px; font-size: 13px;
            border-radius: 4px; cursor: pointer; margin-top: 10px; transition: all 0.2s;
        }
        .btn-top.active {
            background-color: #D1E7DD; color: #0F5132; font-weight: bold; border-color: #BADBCC;
        }

        .signature {
            margin-top: auto; padding-top: 30px; font-size: 12px;
            font-style: italic; color: #7F8C8D; line-height: 1.5;
        }

        /* 右侧输出面板 */
        .output-panel {
            flex: 6;
            min-width: 450px;
            padding: 20px;
            background: #FDFDFD;
            max-height: 700px;
            overflow-y: auto;
        }
        
        /* 报告内部排版 */
        .report-header {
            background-color: var(--primary-color); padding: 12px;
            border-radius: 4px; margin-bottom: 15px;
        }
        .report-header h2 { color: #FFFFFF; font-size: 18px; margin: 0; }
        .report-header p { color: #BDC3C7; font-size: 11px; margin-top: 4px; }
        
        .report-sec-title { color: var(--accent-color); font-size: 14px; font-weight: bold; margin: 18px 0 8px 0; }
        .report-sec-title.orange { color: var(--warning-color); }
        
        .report-table { width: 100%; border-collapse: collapse; font-family: Consolas, monospace; font-size: 14px; margin-bottom: 10px; }
        .report-table td { padding: 4px 0; }
        
        .math-box {
            font-size: 12px; color: #333; background-color: #F9F9F9;
            padding: 10px; border: 1px solid #E5E7E9; border-left: 4px solid var(--warning-color);
            font-family: Consolas, monospace; line-height: 1.6; border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>

    <!-- 1. 启动欢迎画面 (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-title">BeniCalc</div>
        <div class="splash-sub">矿浆自流管道水力学计算工具</div>
        <div class="splash-issue">Issue by Zichao</div>
        <div class="splash-footer">Version 1.0  |  © 2026 All Rights Reserved</div>
    </div>

    <!-- 2. 主程序窗体 -->
    <div class="app-container">
        <!-- 左侧：输入面板 -->
        <div class="input-panel">
            <div class="panel-title">输入设计参数 (Input Parameters)</div>
            
            <div class="form-group">
                <label>固体密度 (Solid Density)</label>
                <input type="number" id="rho_s" value="2700">
                <span class="unit">kg/m³</span>
            </div>
            <div class="form-group">
                <label>液体密度 (Liquid Density)</label>
                <input type="number" id="rho_l" value="1000">
                <span class="unit">kg/m³</span>
            </div>
            <div class="form-group">
                <label>矿浆体积浓度 (Cv)</label>
                <input type="number" id="cv" value="30">
                <span class="unit">%</span>
            </div>
            <div class="form-group">
                <label>中位粒径 (d50)</label>
                <input type="number" id="d50" value="0.074" step="0.001">
                <span class="unit">mm</span>
            </div>
            <div class="form-group">
                <label>矿浆体积流量 (Flow Rate)</label>
                <input type="number" id="flow_rate" value="250">
                <span class="unit">m³/h</span>
            </div>
            <div class="form-group">
                <label>Durand 因子 (FL)</label>
                <input type="number" id="fl" value="1.25" step="0.01">
                <span class="unit">-</span>
            </div>
            <div class="form-group">
                <label>流速安全余量 (Margin)</label>
                <input type="number" id="v_margin" value="0.3" step="0.1">
                <span class="unit">m/s</span>
            </div>

            <button class="btn-calc" onclick="runCalculation()">运 行 计 算 (Calculate)</button>
            <button class="btn-top" id="btn-top" onclick="toggleAlwaysOnTop()">📌 开启窗口始终置顶</button>
            
            <div class="signature">
                Engineering Design Tool<br>Issued by Zichao © 2026
            </div>
        </div>

        <!-- 右侧：输出面板 -->
        <div class="output-panel" id="output-area">
            <!-- 计算报告会通过 JS 动态渲染到这里 -->
        </div>
    </div>

    <script>
        // 控制欢迎画面延时 2 秒后淡出
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
            }, 2000);
            runCalculation(); // 默认载入时自动算一次
        });

        // 模拟置顶提示
        let isTop = false;
        function toggleAlwaysOnTop() {
            isTop = !isTop;
            const btn = document.getElementById('btn-top');
            if (isTop) {
                btn.innerText = "📌 窗口置顶说明 (请按 Alt+Tab 配合图纸)";
                btn.classList.add('active');
                alert("提示：标准网页无法直接强制锁定系统底层窗体。建议将浏览器窗口缩小，拖动到排管软件（如MicroStation）一侧配合使用，效果最佳！");
            } else {
                btn.innerText = "📌 开启窗口始终置顶";
                btn.classList.remove('active');
            }
        }

        // 核心水力学计算函数
        function runCalculation() {
            // 1. 获取输入数据
            const rho_s = parseFloat(document.getElementById('rho_s').value);
            const rho_l = parseFloat(document.getElementById('rho_l').value);
            const cv_percent = parseFloat(document.getElementById('cv').value);
            const cv = cv_percent / 100.0;
            const d50 = parseFloat(document.getElementById('d50').value) / 1000.0;
            const flow_rate = parseFloat(document.getElementById('flow_rate').value);
            const fl = parseFloat(document.getElementById('fl').value);
            const v_margin = parseFloat(document.getElementById('v_margin').value);

            const g = 9.81;

            // 2. 基础物理参数推导
            const Ss = rho_s / rho_l;
            const rho_m = rho_s * cv + rho_l * (1.0 - cv);
            const Sm = rho_m / rho_l;
            const q_cms = flow_rate / 3600.0;

            // 3. 连续性方程与临界流速 100次数值迭代循环 (求出收敛内径)
            let d_guess = Math.sqrt((4.0 * q_cms) / (Math.PI * 2.0));
            let v_critical = 0;
            let v_design = 0;

            for (let i = 0; i < 100; i++) {
                v_critical = fl * Math.sqrt(2 * g * d_guess * (Ss - 1));
                let v_target = v_critical + v_margin;
                let d_new = Math.sqrt((4.0 * q_cms) / (Math.PI * v_target));
                if (Math.abs(d_new - d_guess) < 1e-6) {
                    d_guess = d_new;
                    break;
                }
                d_guess = d_new;
            }
            v_design = q_cms / (Math.PI * Math.pow(d_guess, 2) / 4.0);

            // 4. 水力坡度计算 (Swamee-Jain + Durand-Condolios)
            const reynolds = (v_design * d_guess) / 1.004e-6;
            
            // 计算纯水摩阻系数 f
            let f_w = 0.02; 
            if (reynolds > 2300) {
                const e = 0.045 / 1000.0;
                f_w = 0.25 / Math.pow(Math.log10((e / (3.7 * d_guess)) + (5.74 / Math.pow(reynolds, 0.9))), 2);
            } else {
                f_w = 64.0 / reynolds;
            }

            const i_water = (f_w * Math.pow(v_design, 2)) / (2 * g * d_guess);
            const cd = 24.0 / 10.0;
            const psi = (g * d_guess * (Ss - 1)) / (Math.pow(v_design, 2) * Math.sqrt(cd));
            const durand_factor_add = 81.0 * Math.pow(psi, 1.5) * cv;
            
            const i_m = i_water * (1.0 + durand_factor_add);
            const i_slurry = i_m / Sm;

            // 5. 动态拼接 HTML 汇总报告
            let html = [];
            html.push("<div class='report-header'>");
            html.push("  <h2>BeniCalc - 矿浆自流计算汇总报告</h2>");
            html.push(`  <p>Process Piping Hydraulic Calculation Sheet | <b>Issued by Zichao</b></p>`);
            html.push("</div>");

            // 一、 工程设计核心结论
            html.push("<div class='report-sec-title'>🎯 一、 工程设计核心结论 (Sizing Summary)</div>");
            html.push("<table class='report-table'>");
            html.push(`  <tr><td><b>● 建议管道理论内径 (Min ID):</b></td><td><b style='color:var(--danger-color); font-size:15px;'>${(d_guess * 1000).toFixed(1)} mm</b></td></tr>`);
            html.push(`  <tr><td><b>● 理论水力坡度 (i_slurry):</b></td><td><b>${i_slurry.toFixed(5)} m(Slurry)/m</b></td></tr>`);
            html.push(`  <tr><td><b>● 建议理论最小几何坡度:</b></td><td><b style='color:var(--success-color);'>${(i_slurry * 100).toFixed(3)} %</b></td></tr>`);
            html.push(`  <tr><td><b>● 经验推荐布管坡度 (1.3x):</b></td><td><b style='color:var(--warning-color); font-size:15px;'>${(i_slurry * 1.3 * 100).toFixed(3)} %</b></td></tr>`);
            html.push("</table>");
            html.push("<p style='font-size:11px; color:#7F8C8D; margin-top:5px; margin-bottom:15px;'><i>* 排管提示：在三维模型(如OpenPlant)中放坡时，实际物理坡度必须大于推荐布管坡度，保证非满管流。</i></p>");

            // 二、 管径与流速校核
            html.push("<div class='report-sec-title'>📊 二、 管径与流速校核 (Velocity Verification)</div>");
            html.push("<table class='report-table'>");
            html.push(`  <tr><td>- 设计体积流量 (Q):</td><td><b>${flow_rate.toFixed(1)} m³/h</b> (${q_cms.toFixed(5)} m³/s)</td></tr>`);
            html.push(`  <tr><td>- 临界沉积流速 (V_L):</td><td><b>${v_critical.toFixed(3)} m/s</b></td></tr>`);
            html.push(`  <tr><td>- 实际运行流速 (V_d):</td><td><b style='color:var(--accent-color);'>${v_design.toFixed(3)} m/s</b></td></tr>`);
            html.push(`  <tr><td>- 安全校核状态:</td><td><b style='color:var(--success-color);'>流速安全，大于不沉积临界流速 ✓</b></td></tr>`);
            html.push("</table>");

            // 三、 矿浆基础物性
            html.push("<div class='report-sec-title'>🧪 三、 矿浆基础物性 (Slurry Properties)</div>");
            html.push("<table class='report-table'>");
            html.push(`  <tr><td>- 固体比重 (Ss):</td><td><b>${Ss.toFixed(3)}</b></td></tr>`);
            html.push(`  <tr><td>- 矿浆体积浓度 (Cv):</td><td><b>${cv_percent.toFixed(1)} %</b></td></tr>`);
            html.push(`  <tr><td>- 矿浆相对密度 (Sm):</td><td><b>${Sm.toFixed(3)}</b> (密度: {rho_m.toFixed(1)} kg/m³)</td></tr>`);
            html.push("</table>");

            // 四、 完整数理推导过程
            html.push("<div class='report-sec-title orange'>📝 四、 完整数理推导过程 (Detailed Calculation Sheets)</div>");
            html.push("<div class='math-box'>");
            html.push("<b>【步骤 1：管径与临界流速迭代】</b><br>");
            html.push(` &nbsp; V_L = FL * √(2 * g * D * (Ss - 1)) = ${fl} * √(2 * 9.81 * D * (${Ss.toFixed(3)} - 1))<br>`);
            html.push(` &nbsp; <span style='color:var(--success-color);'>[迭代收敛] → 得内径 D = <b>${d_guess.toFixed(4)} m</b>，临界流速 V_L = <b>${v_critical.toFixed(3)} m/s</b></span><br>`);
            html.push(` &nbsp; 最终流速：V_d = (4 * ${q_cms.toFixed(5)}) / (π * ${d_guess.toFixed(4)}²) = <b>${v_design.toFixed(3)} m/s</b><br><br>`);
            html.push("<b>【步骤 2：纯水基础摩阻系数 (Swamee-Jain)】</b><br>");
            html.push(` &nbsp; Re = (${v_design.toFixed(3)} * ${d_guess.toFixed(4)}) / 1.004e-6 = <b>${reynolds.toExponential(3)}</b><br>`);
            html.push(` &nbsp; 经公式求得纯水达西阻力系数 f = <b>{f_w.toFixed(5)}</b><br>`);
            html.push(` &nbsp; 基准纯水损失 i_w = (f * V_d²) / (2 * g * D) = <b>${i_water.toFixed(5)} m(H2O)/m</b><br><br>`);
            html.push("<b>【步骤 3：固体加成修正 (Durand-Condolios)】</b><br>");
            html.push(` &nbsp; Ψ = (g * D * (Ss - 1)) / (V_d² * √Cd) = <b>${psi.toFixed(4)}</b><br>`);
            html.push(` &nbsp; 阻力增量项 Φ = 81 * (${psi.toFixed(4)}^1.5) * ${cv.toFixed(3)} = <b>${durand_factor_add.toFixed(4)}</b><br>`);
            html.push(` &nbsp; 修正后摩阻 i_m = ${i_water.toFixed(5)} * (1 + ${durand_factor_add.toFixed(4)}) = <b>${(i_water * (1 + durand_factor_add)).toFixed(5)} m(H2O)/m</b><br><br>`);
            html.push("<b>【步骤 4：水头转换与放坡结论】</b><br>");
            html.push(` &nbsp; 物理矿浆水柱损失 i_slurry = i_m / Sm = <b>${i_slurry.toFixed(5)} m(Slurry)/m</b><br>`);
            html.push(` &nbsp; 理论最小几何坡度 = <b>${(i_slurry * 100).toFixed(3)} %</b> | 1.3x 推荐布管坡度 = <b>${(i_slurry * 1.3 * 100).toFixed(3)} %</b>`);
            html.push("</div>");

            // 6. 刷入右侧区域
            document.getElementById('output-area').innerHTML = html.join("");
        }
    </script>
</body>
</html>
